  <style>
/* RinggitKyat - cleaner fintech design */
:root {
  --navy: #061735;
  --green: #087f5b;
  --gold: #f3c969;
  --text: #17324d;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, "Noto Sans Myanmar", sans-serif;
  color: var(--text);
  background-color: var(--navy);
  background-image:
    linear-gradient(rgba(3, 14, 36, 0.84), rgba(3, 14, 36, 0.90)),
    url("./NEW%20BACKGROUND.png");
  background-position: center top;
  background-size: cover;
  background-repeat: no-repeat;
  background-attachment: fixed;
}

/* Main content cards */
body > section,
body > main,
body > div {
  box-sizing: border-box;
}

/* Consistent rounded inputs */
input,
select,
button {
  font: inherit;
  border-radius: 10px;
}

input,
select {
  min-height: 44px;
  box-sizing: border-box;
}

/* Clear, modern buttons */
button {
  transition: filter 0.2s ease, transform 0.2s ease;
}

button:hover {
  filter: brightness(1.06);
}

button:active {
  transform: translateY(1px);
}

/* Keep admin form readable on the dark background */
#adminPanel {
  box-sizing: border-box;
  width: min(92%, 480px);
  margin: 32px auto;
  padding: 24px;
  color: #ffffff;
  background: rgba(5, 20, 47, 0.94);
  border: 1px solid rgba(243, 201, 105, 0.55) !important;
  border-radius: 18px !important;
  box-shadow: 0 16px 42px rgba(0, 0, 0, 0.25);
}

#adminPanel h2,
#adminPanel h3,
#adminPanel label,
#adminPanel p {

}

#adminPanel input {

  border: 1px solid #d8e3ee;
  background: #ffffff;
  color: #17324d;
  padding: 10px 12px;
}

#adminPanel button {
  border: 0;
  background: var(--green);
  color: #ffffff;
  padding: 12px 18px;
  font-weight: 700;
  cursor: pointer;
}

/* Mobile-friendly layout */
@media (max-width: 600px) {

  <script>
    // 以下为演示汇率，请在正式使用前改成你的实际报价。
    let mmkToMyrRate = 800;
let myrToMmkRate = 780;
    const whatsappNumber = "601168512705";

    const direction = document.getElementById("direction");
    const amount = document.getElementById("amount");
    const result = document.getElementById("result");
    const amountLabel = document.getElementById("amountLabel");
    const rateNote = document.getElementById("rateNote");
    const whatsapp = document.getElementById("whatsapp");

    function update() {
      const value = Number(amount.value) || 0;
      const isMmkToMyr = direction.value === "mmk-myr";   
const converted = isMmkToMyr
        ? value / mmkToMyrRate
        : value * myrToMmkRate;

      amountLabel.textContent = isMmkToMyr
        ? "兑换金额（MMK）"
        : "兑换金额（MYR）";

      result.textContent = isMmkToMyr
        ? "RM " + converted.toLocaleString("en-MY", {
            minimumFractionDigits: 2, maximumFractionDigits: 2
          })
        : converted.toLocaleString("en-US", {
            maximumFractionDigits: 2
          }) + " MMK";

      
rateNote.textContent =
        "MMK → MYR：1 MYR = " + mmkToMyrRate +
        " MMK；MYR → MMK：1 MYR = " + myrToMmkRate +
        " MMK。以上为参考报价，实际交易金额以确认报价为准。";

      
      const message = "你好，我想咨询换汇：" + value + " " +
        (isMmkToMyr ? "MMK → MYR" : "MYR → MMK") +
        "。网站显示的参考金额为 " + result.textContent +
        "，请确认最新汇率。";

      whatsapp.href = whatsappNumber
        ? "https://wa.me/" + whatsappNumber +
          "?text=" + encodeURIComponent(message)
        : "https://wa.me/?text=" + encodeURIComponent(message);
    }

    direction.addEventListener("change", update);
    amount.addEventListener("input", update);
    async function loadExchangeRates() {
  const supabaseUrl = "https://expdhkafzwohizszwdyd.supabase.co";
  const supabaseKey = "sb_publishable_roKipX4wYIT1GZ7o-Awl9g_EVF_4K6n";

  try {
    const response = await fetch(
      supabaseUrl + "/rest/v1/exchange_rates?select=mmk_to_myr_rate,myr_to_mmk_rate,updated_at&id=eq.1",
      {
        headers: {
          apikey: supabaseKey,
          Authorization: "Bearer " + supabaseKey
        }
      }
    );

    if (!response.ok) {
      throw new Error("无法读取汇率");
    }

    const rows = await response.json();

    if (rows.length > 0) {
      mmkToMyrRate = Number(rows[0].mmk_to_myr_rate);
      myrToMmkRate = Number(rows[0].myr_to_mmk_rate);
            const updatedAtElement = document.getElementById("rateLastUpdated");
      if (updatedAtElement && rows[0].updated_at) {
        const updatedDate = new Date(rows[0].updated_at);
        updatedAtElement.textContent =
          "汇率最后更新：" +
          updatedDate.toLocaleString("en-MY", {
            timeZone: "Asia/Kuala_Lumpur",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            hour12: true
          }) +
          "（马来西亚时间）";
      }
      update();
    }
  } catch (error) {
    console.error("读取汇率失败：", error);
  }
}

loadExchangeRates();
    update();

    );

    const data = await response.json();

document.getElementById("rateEditor").style.display = "block";

message.textContent = "登录成功！现在可以修改汇率。";
document.getElementById("adminPassword").value = "";

    // 保存汇率到 Supabase
document.addEventListener("DOMContentLoaded", function () {
  document.getElementById("saveRatesButton").addEventListener("click", async function () {
    const message = document.getElementById("saveRatesMessage");
    const button = document.getElementById("saveRatesButton");

    const mmkRate = Number(document.getElementById("editMmkToMyr").value);
    const myrRate = Number(document.getElementById("editMyrToMmk").value);

    if (!window.exchangeAdminToken) {
      message.textContent = "请先登录管理员账号。";
      return;
    }

    if (!Number.isFinite(mmkRate) || mmkRate <= 0 ||
        !Number.isFinite(myrRate) || myrRate <= 0) {
      message.textContent = "请输入大于 0 的有效汇率。";
      return;
    }

    button.disabled = true;
    message.textContent = "正在保存...";

    try {
      const response = await fetch(
        "https://expdhkafzwohizszwdyd.supabase.co/rest/v1/exchange_rates?id=eq.1",
        {
          method: "PATCH",
          headers: {
            "Content-Type": "application/json",
            "apikey": "sb_publishable_roKipX4wYIT1GZ7o-Awl9g_EVF_4K6n",
            "Authorization": "Bearer " + window.exchangeAdminToken,
            "Prefer": "return=representation"
          },
          body: JSON.stringify({
            mmk_to_myr_rate: mmkRate,
            myr_to_mmk_rate: myrRate,
            updated_at: new Date().toISOString()
          })
        }
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.message || data.msg || "保存失败，请检查管理员权限。");
      }

      if (!Array.isArray(data) || data.length === 0) {
        throw new Error("数据库没有更新任何记录，请检查管理员权限和汇率记录。");
      }

      mmkToMyrRate = mmkRate;
      myrToMmkRate = myrRate;
            const updatedAtElement = document.getElementById("rateLastUpdated");
      if (updatedAtElement) {
        updatedAtElement.textContent =
          "汇率最后更新：" +
          new Date().toLocaleString("en-MY", {
            timeZone: "Asia/Kuala_Lumpur",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            hour12: true
          }) +
          "（马来西亚时间）";
      }
      update();

      message.textContent = "汇率保存成功！网站报价已更新。";
    } catch (error) {
      message.textContent = error.message || "保存失败，请稍后再试。";
    } finally {
      button.disabled = false;
    }
  });
});

document.addEventListener("DOMContentLoaded", function () {

  adminPanel.style.display = "none";

});
    
  
  // 三语切换与记忆
  document.addEventListener("DOMContentLoaded", function () {
    const languageSelect = document.getElementById("languageSelect");

    const translations = {
      my: {
        title: "MMK ⇄ MYR",
        description: "မြန်မာကျပ်နှင့် မလေးရှားရင်းဂစ် ငွေလဲဝန်ဆောင်မှု။<br>ရိုးရှင်းလွယ်ကူစွာ ခန့်မှန်းငွေပမာဏကို ကြည့်ရှုနိုင်ပါသည်။"
      },
      en: {
        title: "MMK ⇄ MYR",
        description: "Myanmar Kyat to Malaysian Ringgit exchange service.<br>Check estimated exchange amounts quickly and easily."
      },
      zh: {
        title: "MMK ⇄ MYR",
        description: "缅币 · 马币兑换服务。<br>简单、方便，轻松查询参考金额。"
      }
    };

    function applyLanguage(language) {
      const text = translations[language] || translations.my;
      document.getElementById("pageTitle").textContent = text.title;
      document.getElementById("pageDescription").innerHTML = text.description;
      languageSelect.value = language;
      localStorage.setItem("siteLanguage", language);
    }

    const savedLanguage = localStorage.getItem("siteLanguage") || "my";
    applyLanguage(savedLanguage);

    languageSelect.addEventListener("change", function () {
      applyLanguage(languageSelect.value);
    });
  });

  </script>
